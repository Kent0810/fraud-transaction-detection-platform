name: Claude Review
on:
  pull_request:

jobs:
  review:
    uses: Kent0810/shared-workflows/.github/workflows/claude-review.yml@main
    secrets:
      federation_rule_id: ${{ secrets.FEDERATION_RULE_ID }}
      organization_id: ${{ secrets.ORGANIZATION_ID }}
      service_account_id: ${{ secrets.SERVICE_ACCOUNT_ID }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
